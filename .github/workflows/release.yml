name: Build and Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mobile and Wear OS APKs
        run: gradle :mobile:assembleDebug :wear:assembleDebug

      - name: Rename APKs for Release
        run: |
          cp mobile/build/outputs/apk/debug/mobile-debug.apk koenote-mobile-${{ github.ref_name }}-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk koenote-wear-${{ github.ref_name }}-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koenote-mobile-${{ github.ref_name }}-debug.apk
            koenote-wear-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
